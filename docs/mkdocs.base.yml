site_name: FateFlix
site_description: A downstream NixOS media appliance built on NixFlix
repo_url: https://github.com/dales-garage/fateflix
repo_name: dales-garage/fateflix
edit_uri: edit/main/docs/
theme:
  name: material
  logo: assets/logo.svg
  palette:
    - scheme: latte
      media: "(prefers-color-scheme: light)"
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to Frappé
    - scheme: frappe
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to Macchiato
    - scheme: macchiato
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-partly-cloudy
        name: Switch to Mocha
    - scheme: mocha
      media: "(prefers-color-scheme: dark)"
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-cloudy
        name: Switch to Latte
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow
    - toc.integrate
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
  icon:
    repo: fontawesome/brands/github
  font:
    text: Roboto
    code: Roboto Mono
plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
      lang: en
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
      fallback_to_build_date: true
      enabled: !ENV [ENABLE_GIT_REVISION, false]
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      use_pygments: true
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [docs]
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - abbr
nav:
  - Home: index.md
  - Getting Started:
      - getting-started/index.md
      - Architecture and Configuration: fateflix.md
  - Operations:
      - GitOps and Updates: gitops.md
      - Operations Guide: operations.md
      - Dependency Updates: dependency-updates.md
      - Migration Runbook: migration/nixflix.md
  - Examples:
      - Basic Setup: examples/basic-setup.md
      - Jellyfin Plugins: examples/jellyfin-plugins.md
      - Jellyfin Subtitles: examples/jellyfin-subtitles.md
      - Maintainerr Rules: examples/maintainerr-rules.md
      - Homepage: examples/homepage.md
# REFERENCE_NAV_PLACEHOLDER
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/dales-garage/fateflix
extra_css:
  - stylesheets/extra.css
copyright: NixFlix by Kiri Walawren; FateFlix downstream contributors. Licensed under MPL 2.0.
