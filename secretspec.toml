[project]
name = "nixflix"
revision = "1.0"

[profiles.default]
SMB_CREDENTIALS = { description = "NAS mount.cifs credentials file", required = true }
SONARR_API_KEY = { description = "HD Sonarr API key (source sonarr2)", required = true }
SONARR_4K_API_KEY = { description = "4K Sonarr API key (source sonarr)", required = true }
RADARR_API_KEY = { description = "HD Radarr API key (source radarr2)", required = true }
RADARR_4K_API_KEY = { description = "4K Radarr API key (source radarr)", required = true }
LIDARR_API_KEY = { description = "Lidarr API key", required = true }
PROWLARR_API_KEY = { description = "Prowlarr API key", required = true }
SABNZBD_API_KEY = { description = "SABnzbd API key", required = true }

[profiles.notifications]
DISCORD_APPRISE_URL = { description = "Apprise discord://webhook-id/webhook-token destination", required = true }
MATRIX_APPRISE_URL = { description = "Apprise matrixs://token@homeserver/!room destination", required = true }

[profiles.public_tls]
CLOUDFLARE_DNS_API_TOKEN = { description = "Router Caddy DNS validation token: Zone Read and DNS Edit for dalebox.pw", required = true }
