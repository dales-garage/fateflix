name: Upstream dependency update
on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 0'
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: upstream-sync
  cancel-in-progress: false
jobs:
  sync:
    timeout-minutes: 10
    if: github.repository == 'declarative-dale/nixflix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: DeterminateSystems/determinate-nix-action@v3.24.1
        with:
          kvm: false
      - name: Create upstream dependency PR and dispatch CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update-pr.py upstream
