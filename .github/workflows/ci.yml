name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run every check instead of comparing against main
        type: boolean
        default: false
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Select affected checks
    runs-on: ubuntu-latest
    outputs:
      checks: ${{ steps.checks.outputs.checks }}
      has_checks: ${{ steps.checks.outputs.has_checks }}
      production: ${{ steps.checks.outputs.production }}
      gitops: ${{ steps.checks.outputs.gitops }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Require synchronized update artifacts
        run: python3 scripts/renovate-artifacts.py check

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3.23.3

      - name: Plan checks from changed derivations
        id: checks
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_EVENT: ${{ github.event_name }}
          CI_FULL: ${{ inputs.full || false }}
        run: |
          if [ "$CI_FULL" = true ]; then
            python3 scripts/ci-plan.py plan --full
          elif [ "$CI_EVENT" = workflow_dispatch ]; then
            base=$(git merge-base HEAD origin/main)
            python3 scripts/ci-plan.py plan --base "$base"
          else
            python3 scripts/ci-plan.py plan --base "$CI_BASE_SHA"
          fi

  checks:
    name: ${{ matrix.check }}
    needs: prepare
    if: needs.prepare.outputs.has_checks == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.prepare.outputs.checks) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3.23.3
        with:
          kvm: true

      - name: Run Check 📋
        run: |
          if nix eval --json ".#checks.x86_64-linux.${{ matrix.check }}.passthru.meta.requiresNetwork" 2>/dev/null | grep -q "true"; then
            echo "Test requires network access, disabling sandbox"
            nix build --no-write-lock-file -L --quiet .#checks.x86_64-linux.${{ matrix.check }} --option sandbox false
          else
            nix build --no-write-lock-file -L --quiet .#checks.x86_64-linux.${{ matrix.check }}
          fi

  production:
    name: Production system
    needs: prepare
    if: needs.prepare.outputs.production == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Free runner space for the production closure
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - uses: DeterminateSystems/determinate-nix-action@v3.23.3
      - run: nix build --no-write-lock-file --no-link -L .#nixosConfigurations.nixflix-production.config.system.build.toplevel

  gitops:
    name: GitOps tooling
    needs: prepare
    if: needs.prepare.outputs.gitops == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - run: python -m pip install PyYAML
      - run: python -m unittest discover -s tests/migration -p 'test_*.py'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npx --yes --package renovate renovate-config-validator --strict renovate.json

  required:
    name: CI required
    if: always()
    needs: [prepare, checks, production, gitops]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require every selected job to pass
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/ci-plan.py verify
