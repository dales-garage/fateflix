name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Find Checks 🔍
    runs-on: ubuntu-latest
    outputs:
      checks: ${{ steps.checks.outputs.checks }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Find Checks 🔍
        id: checks
        run: |
          nix eval --json '.#checks.x86_64-linux' --apply builtins.attrNames | perl -pe 's|(.*)|checks=\1|' >> "$GITHUB_OUTPUT"

  checks:
    name: ${{ matrix.check }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.prepare.outputs.checks) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      # Enable KVM for VM tests
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Check 📋
        run: |
          if nix eval --json ".#checks.x86_64-linux.${{ matrix.check }}.passthru.meta.requiresNetwork" 2>/dev/null | grep -q "true"; then
            echo "Test requires network access, disabling sandbox"
            nix build --no-write-lock-file -L --quiet .#checks.x86_64-linux.${{ matrix.check }} --option sandbox false
          else
            nix build --no-write-lock-file -L --quiet .#checks.x86_64-linux.${{ matrix.check }}
          fi

  production:
    name: Production system
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Free runner space for the production closure
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - uses: cachix/install-nix-action@v31
      - run: nix build --no-write-lock-file --no-link -L .#nixosConfigurations.nixflix-production.config.system.build.toplevel

  gitops:
    name: GitOps tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install PyYAML
      - run: python -m unittest discover -s tests/migration -p 'test_*.py'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npx --yes --package renovate renovate-config-validator --strict renovate.json

  required:
    name: CI required
    if: always()
    needs: [prepare, checks, production, gitops]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
