name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      full:
        description: Run every Nix check and both host builds
        type: boolean
        default: false
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: '1'
  GC_FREE_SPACE_DIVISOR: '16'
  GC_INITIAL_HEAP_SIZE: '104857600'
  # Bound evaluation/build memory on standard hosted runners.
  NIX_CONFIG: |
    eval-cores = 1
    max-jobs = 1
    cores = 2

jobs:
  prepare:
    name: Plan validation
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      checks: ${{ steps.plan.outputs.checks }}
      has_checks: ${{ steps.plan.outputs.has_checks }}
      production: ${{ steps.plan.outputs.production }}
      gitops: ${{ steps.plan.outputs.gitops }}
      renovate: ${{ steps.plan.outputs.renovate }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require synchronized update artifacts
        run: python3 scripts/renovate-artifacts.py check
      - name: Require dependency ownership coverage
        run: python3 scripts/extra_dependencies.py audit > "$RUNNER_TEMP/dependency-coverage.json"
      - name: Select validation from changed paths
        id: plan
        env:
          CI_BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha || github.event.before }}
          CI_EVENT: ${{ github.event_name }}
          CI_FULL: ${{ inputs.full || false }}
        run: |
          python=python3
          if ! python3 -c 'import yaml' && python3 -m venv "$RUNNER_TEMP/ci-plan" &&
             "$RUNNER_TEMP/ci-plan/bin/pip" install --disable-pip-version-check -r .github/requirements-ci.txt; then
            python="$RUNNER_TEMP/ci-plan/bin/python"
          fi
          if [ "$CI_FULL" = true ]; then
            "$python" scripts/ci-plan.py plan --full
          elif [ "$CI_EVENT" = workflow_dispatch ]; then
            "$python" scripts/ci-plan.py plan --base origin/main
          else
            "$python" scripts/ci-plan.py plan --base "$CI_BASE_SHA"
          fi

  gitops:
    name: Python tests
    needs: prepare
    if: needs.prepare.outputs.gitops == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - run: python -m pip install --disable-pip-version-check -r .github/requirements-ci.txt
      - run: python -m unittest discover -s tests/migration -p 'test_*.py'

  renovate:
    name: Renovate configuration
    needs: prepare
    if: needs.prepare.outputs.renovate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          # Renovate 44 supports Node ^24.11.0; update this pair together.
          node-version: '24.22.3'
      # renovate: datasource=npm depName=renovate
      - run: npx --yes --package renovate@44.263.4 renovate-config-validator --strict renovate.json

  checks:
    name: ${{ matrix.name }}
    needs: graph
    if: needs.graph.outputs.has_checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.graph.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Free runner space for VM tests
        if: matrix.vm
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - uses: DeterminateSystems/determinate-nix-action@v3.24.3
        with:
          kvm: ${{ matrix.vm }}
      - name: Build and run selected check
        env:
          CHECK_NAMES: ${{ join(matrix.checks, ' ') }}
          REQUIRES_NETWORK: ${{ matrix.network }}
        run: |
          options=()
          read -r -a checks <<< "$CHECK_NAMES"
          targets=()
          for check in "${checks[@]}"; do
            targets+=(".#checks.x86_64-linux.$check")
          done
          test "${#targets[@]}" -gt 0
          if [ "$REQUIRES_NETWORK" = true ]; then
            options+=(--option sandbox false)
          fi
          nix build --no-write-lock-file --no-link --keep-going -L "${targets[@]}" "${options[@]}"

  evaluate:
    name: Full flake evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@v3.24.3
        with:
          kvm: false
      - run: nix build --no-write-lock-file --no-link .#lib.nixflixSource
      - run: nix eval --impure --json --file tests/fixture-paths.nix
      - run: nix flake check --no-build --no-write-lock-file --show-trace
      - run: nix eval --no-write-lock-file .#nixosConfigurations.fateflix.config.system.build.toplevel.drvPath
      - run: nix eval --no-write-lock-file .#nixosConfigurations.nixflix-production.config.system.build.toplevel.drvPath
      - run: nix eval --no-write-lock-file .#nixosConfigurations.nixflix-staging.config.system.build.toplevel.drvPath

  graph:
    name: Plan Nix builds
    needs: prepare
    permissions:
      actions: read
      contents: read
    env:
      CI_RECORD_GRAPH: >-
        ${{ github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.base.ref == github.event.repository.default_branch }}
    outputs:
      has_checks: ${{ steps.graph.outputs.has_checks }}
      production: ${{ steps.graph.outputs.production }}
      matrix: ${{ steps.graph.outputs.matrix }}
      builds: ${{ steps.graph.outputs.builds }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: DeterminateSystems/determinate-nix-action@v3.24.3
        if: env.CI_RECORD_GRAPH == 'true'
        with:
          kvm: false
      - name: Prepare Nix graph fixtures
        if: env.CI_RECORD_GRAPH == 'true'
        run: |
          nix build --no-write-lock-file --no-link .#lib.nixflixSource
          nix eval --impure --json --file tests/fixture-paths.nix
      - name: Select Nix builds from the evaluated dependency graph
        id: graph
        env:
          CI_PLAN: ${{ toJSON(needs.prepare.outputs) }}
          CI_FULL: ${{ inputs.full || false }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python=python3
          if [ "$CI_RECORD_GRAPH" = true ] &&
             python3 -m venv "$RUNNER_TEMP/ci-graph" &&
             "$RUNNER_TEMP/ci-graph/bin/pip" install --disable-pip-version-check -r .github/requirements-ci.txt; then
            python="$RUNNER_TEMP/ci-graph/bin/python"
          fi
          args=()
          if [ "$CI_FULL" = true ]; then args+=(--full); fi
          "$python" scripts/ci-plan.py graph "${args[@]}"

  production:
    name: Both host systems
    needs: graph
    if: needs.graph.outputs.production == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Free runner space for both host closures
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - uses: DeterminateSystems/determinate-nix-action@v3.24.3
        with:
          kvm: false
      - run: nix build --no-write-lock-file --no-link -L .#nixosConfigurations.nixflix-production.config.system.build.toplevel .#nixosConfigurations.nixflix-staging.config.system.build.toplevel
      - run: python3 scripts/check-secret-canary.py

  required:
    name: CI required
    if: always()
    needs: [prepare, evaluate, graph, checks, production, gitops, renovate]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require every selected job to pass
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/ci-plan.py verify
      - name: Record fresh Nix build evidence
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/ci-plan.py record --evidence "$RUNNER_TEMP/ci-build-evidence.json"
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'pull_request'
        continue-on-error: true
        with:
          name: ci-build-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-build-evidence.json
          retention-days: 7
          if-no-files-found: ignore
