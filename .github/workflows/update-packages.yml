name: Custom package updates
on:
  workflow_dispatch:
  schedule:
    - cron: '30 12 * * 0'
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: custom-package-updates
  cancel-in-progress: false
jobs:
  update:
    if: github.repository == 'declarative-dale/nixflix'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [notifiarr, maintainerr, caddy, jellyfin-plugins, navidrome-plugins]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - name: Generate scoped update PR and dispatch CI
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ matrix.package }}
        run: python3 scripts/update-pr.py "$PACKAGE"
