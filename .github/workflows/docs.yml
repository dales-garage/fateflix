name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - README.md
      - modules/**
      - capabilities/**
      - integrations/**
      - lib/**
      - pkgs/**
      - flake.nix
      - flake.lock
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  NIX_CONFIG: |
    eval-cores = 1
    max-jobs = 1
    cores = 2

jobs:
  build:
    name: Build Documentation
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3.24.1
        with:
          kvm: false

      - name: Build Documentation
        run: |
          nix build .#docs -L

      - name: Copy build artifacts
        run: |
          cp -r result/ _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

  deploy:
    name: Deploy to GitHub Pages
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
